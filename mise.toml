[tools]
actionlint = "1.7.12"
"pipx:zizmor" = "1.29.0"

[env]
HOMEBREW_NO_AUTO_UPDATE = "1"

[tasks.audit]
description = "Audit every formula and cask through Homebrew"
sources = ["Formula/**/*.rb", "Casks/**/*.rb", "mise.toml"]
run = '''
set -eu
tap_parent="$(brew --repository)/Library/Taps/uinaf"
mkdir -p "$tap_parent"
tap_path="$(mktemp -d "$tap_parent/homebrew-verification-XXXXXX")"
rsync -a --exclude=.git ./ "$tap_path/"
cd "$tap_path"
tap="uinaf/${tap_path##*/homebrew-}"
trap 'brew untrust --tap "$tap" >/dev/null 2>&1 || true; rm -rf -- "$tap_path"' EXIT
brew trust --tap "$tap"
brew audit --online --except=version --tap "$tap"
# GoReleaser emits explicit versions; audit every other current and future item.
find Formula Casks -type f -name '*.rb' -print | sort | while IFS= read -r path; do
  if grep -Fqi 'generated by GoReleaser' "$path"; then
    continue
  fi
  name="${path##*/}"
  name="${name%.rb}"
  case "$path" in
    Formula/*) brew audit --online --only=version --formula "$tap/$name" ;;
    Casks/*) brew audit --online --only=version --cask "$tap/$name" ;;
  esac
done
'''

[tasks.audit-changed]
description = "Audit formulae and casks changed from the base branch"
run = '''
set -eu
git symbolic-ref refs/remotes/origin/HEAD "refs/remotes/origin/${GITHUB_BASE_REF:-main}"
if [ -z "$(git diff --name-only --diff-filter=ACMRT origin/HEAD...HEAD -- ':(glob)Formula/**/*.rb' ':(glob)Casks/**/*.rb')" ]; then
  exit 0
fi
tap_parent="$(brew --repository)/Library/Taps/uinaf"
mkdir -p "$tap_parent"
tap_path="$(mktemp -d "$tap_parent/homebrew-verification-XXXXXX")"
rsync -a ./ "$tap_path/"
cd "$tap_path"
tap="uinaf/${tap_path##*/homebrew-}"
trap 'brew untrust --tap "$tap" >/dev/null 2>&1 || true; rm -rf -- "$tap_path"' EXIT
brew trust --tap "$tap"
brew audit --online --except=version --changed
git diff --name-only --diff-filter=ACMRT origin/HEAD...HEAD -- ':(glob)Formula/**/*.rb' ':(glob)Casks/**/*.rb' | sort | while IFS= read -r path; do
  if grep -Fqi 'generated by GoReleaser' "$path"; then
    continue
  fi
  name="${path##*/}"
  name="${name%.rb}"
  case "$path" in
    Formula/*) brew audit --online --only=version --formula "$tap/$name" ;;
    Casks/*) brew audit --online --only=version --cask "$tap/$name" ;;
  esac
done
'''

[tasks.verify-actions]
description = "Verify GitHub Actions"
sources = [".github/**", "mise.toml"]
run = '''
actionlint
zizmor .github/workflows
'''

[tasks.verify]
description = "Verify the tap with cached independent lanes"
depends = ["audit", "verify-actions"]
run = "git diff --check"
