name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: brew audit
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Audit formulae and casks
        run: |
          set -euo pipefail
          brew update
          brew tap-new --no-git uinaf/tap
          tap_path="$(brew --repository uinaf/tap)"
          rsync -a --delete \
            --exclude .git \
            --exclude .github \
            "${GITHUB_WORKSPACE}/" \
            "${tap_path}/"
          shopt -s nullglob
          formulae=(Formula/*.rb)
          casks=(Casks/*.rb)
          if ((${#formulae[@]})); then
            names=()
            for f in "${formulae[@]}"; do
              names+=("$(basename "${f%.rb}")")
            done
            brew audit --strict --online --formula "${names[@]}"
          fi
          if ((${#casks[@]})); then
            names=()
            for f in "${casks[@]}"; do
              names+=("$(basename "${f%.rb}")")
            done
            brew audit --online --cask "${names[@]}"
          fi
