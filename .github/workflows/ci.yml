name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: brew audit
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit formulae and casks
        env:
          # Authenticated GitHub API for --online audits (unauthenticated CI IPs hit rate limits).
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew update
          tap="${GITHUB_REPOSITORY_OWNER}/tap"
          brew tap-new --no-git "$tap"
          brew trust --tap "$tap"
          tap_path="$(brew --repository "$tap")"
          rsync -a --delete \
            --exclude .git \
            --exclude .github \
            "${GITHUB_WORKSPACE}/" \
            "${tap_path}/"
          shopt -s nullglob
          formulae=(Formula/*.rb)
          casks=(Casks/*.rb)
          audit_status=0
          if ((${#formulae[@]})); then
            names=()
            for f in "${formulae[@]}"; do
              names+=("${tap}/$(basename "${f%.rb}")")
            done
            # Skip --strict: GoReleaser always emits `version`, which GitHub
            # release URLs already encode, and brew audit --strict rejects that
            # as redundant. --online still catches dead URLs and checksum issues.
            brew audit --online --formula "${names[@]}" || audit_status=$?
          fi
          if ((${#casks[@]})); then
            names=()
            for f in "${casks[@]}"; do
              names+=("${tap}/$(basename "${f%.rb}")")
            done
            brew audit --online --cask "${names[@]}" || audit_status=$?
          fi
          exit "$audit_status"
