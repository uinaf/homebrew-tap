name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      audit: ${{ steps.filter.outputs.audit }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select changed audit inputs
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            audit:
              - 'Formula/**'
              - 'Casks/**'
            full:
              - 'mise.toml'
              - '.github/workflows/ci.yml'

  audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.audit == 'true' || needs.changes.outputs.full == 'true'
    name: brew audit
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Audit changed formulae and casks
        if: github.event_name == 'pull_request' && needs.changes.outputs.full != 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: mise run audit-changed

      - name: Audit complete tap
        if: github.event_name != 'pull_request' || needs.changes.outputs.full == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: mise run --force audit

  verify:
    if: always()
    needs: [changes, audit]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require the selected audit to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$AUDIT_RESULT" != "success" && "$AUDIT_RESULT" != "skipped" ]]; then
            exit 1
          fi
